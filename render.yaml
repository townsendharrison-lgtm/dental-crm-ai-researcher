services:
  # ---------------------------------------------------------------------------
  # Dental CRM AI Server (FastAPI + LangGraph) on Render with Astral uv
  # ---------------------------------------------------------------------------
  - type: web
    name: dental-crm-ai-server
    runtime: python
    plan: starter
    region: oregon
    buildCommand: "pip install uv && python -m uv pip install --system -r requirements.txt"
    startCommand: "python -m uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["*"]'
