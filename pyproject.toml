[project]
name = "dental-crm-ai-server"
version = "2.0.0"
description = "FastAPI LangGraph Agent Server for Dental School Research and Predictive Comparison"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langgraph>=0.2.34",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.2",
    "langchain-core>=0.3.10",
    "openai>=1.51.0",
    "pydantic>=2.9.2",
    "python-dotenv>=1.0.1",
    "beautifulsoup4>=4.12.3",
    "pypdf>=5.0.1",
    "python-multipart>=0.0.12",
    "supabase>=2.9.0",
    "httpx>=0.27.2",
    "numpy>=2.1.2",
    "scikit-learn>=1.5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
