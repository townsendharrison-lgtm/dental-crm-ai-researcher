[project]
name = "school-ai-service"
version = "0.1.0"
description = "School research service — infrastructure and domain persistence"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
  "openai>=1.60,<3",
  "pdfplumber>=0.11,<1",
  "pypdfium2>=4,<6",
  "pytesseract>=0.3.13,<1",
  "python-docx>=1.1,<2",
  "trafilatura>=1.12,<3",
  "certifi>=2024.0.0",
  "llama-index-core>=0.12,<0.14",
  "llama-index-embeddings-openai>=0.3,<0.5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "respx>=0.21,<1", "reportlab>=4,<5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"
markers = ["integration: requires explicitly configured hosted Supabase resources"]
filterwarnings = ["error::ResourceWarning"]
